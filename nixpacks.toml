[phases.setup]
nixPkgs = ["python311", "python311Packages.pip"]

[phases.install]
cmds = [
  "pip install --break-system-packages --upgrade pip",
  "pip install --break-system-packages -r requirements.txt",
  "playwright install chromium",
  "playwright install-deps"
]

[phases.build]
cmds = [
  "pip install --break-system-packages -r requirements.txt",
  "playwright install chromium",
  "playwright install-deps"
]

[start]
cmd = "python soul.py"